name: Run OpenAI Autonomous Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for the OpenAI-only project agent"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependency
        run: python -m pip install -r autonomous_agent/requirements.txt

      - name: Run autonomous agent
        id: agent
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_TASK: ${{ inputs.task }}
          AGENT_MAX_STEPS: "16"
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Repository secret OPENAI_API_KEY is missing."
            exit 2
          fi
          python autonomous_agent/agent.py "$AGENT_TASK" --workspace . --task-id "github-${GITHUB_RUN_ID}"

      - name: Save agent audit database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-agent-audit-${{ github.run_id }}
          path: .agent/agent_state.sqlite3
          if-no-files-found: ignore
          retention-days: 7

      - name: Open a reviewable pull request
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="agent/run-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "Agent completed without repository changes; no pull request needed."
            exit 0
          fi
          git commit -m "Autonomous agent completed task"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Autonomous agent result #${GITHUB_RUN_ID}" \
            --body "The OpenAI-only autonomous agent completed its task. Review the diff and test results before merging. This PR was not auto-merged."

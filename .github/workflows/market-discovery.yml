name: Scheduled Market Discovery

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bounded buyer-intent discovery scans
        shell: bash
        run: |
          set -u
          mkdir -p reports/market-discovery
          python - <<'PY'
          import json
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          config = json.loads(Path("config/market_feeds.json").read_text(encoding="utf-8"))
          output_dir = Path("reports/market-discovery")
          summary = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "mode": "discovery-only",
              "verified_revenue_usd": 0,
              "feeds": [],
              "limitations": [
                  "RSS titles, excerpts and links are untrusted public leads requiring manual review.",
                  "No comments, posts, DMs, account creation, submissions, or payments are performed.",
                  "A source item is not a qualified buyer or proof of willingness to pay.",
                  "No item counts as revenue without independent payment-provider verification."
              ]
          }
          failures = 0
          for feed in config["feeds"]:
              if not feed.get("enabled", False):
                  continue
              report_path = output_dir / (feed["id"] + ".json")
              cmd = [
                  sys.executable, "-m", "revenue_machine",
                  "--rss", feed["url"],
                  "--report-out", str(report_path)
              ]
              try:
                  result = subprocess.run(cmd, text=True, capture_output=True, timeout=20)
                  entry = {
                      "id": feed["id"],
                      "category": feed.get("category", "uncategorized"),
                      "exit_code": result.returncode,
                      "report_file": str(report_path) if report_path.exists() else None,
                      "error": (result.stderr or "").strip()[-1000:] if result.returncode else None
                  }
                  if result.returncode:
                      failures += 1
                  elif report_path.exists():
                      report = json.loads(report_path.read_text(encoding="utf-8"))
                      plans = report.get("plans", [])
                      entry["collected"] = report["opportunities"]["collected"]
                      entry["source_links"] = sum(bool(item.get("source_url")) for item in plans)
                      entry["descriptions"] = sum(bool(item.get("description")) for item in plans)
                      entry["unreviewed"] = report["opportunities"]["unreviewed_or_not_low_risk"]
                  summary["feeds"].append(entry)
              except subprocess.TimeoutExpired:
                  failures += 1
                  summary["feeds"].append({
                      "id": feed["id"], "category": feed.get("category", "uncategorized"),
                      "exit_code": 124, "error": "Feed scan timed out after 20 seconds."
                  })
          total = sum(item.get("collected", 0) for item in summary["feeds"])
          links = sum(item.get("source_links", 0) for item in summary["feeds"])
          summary["totals"] = {
              "items_collected": total,
              "items_with_source_links": links,
              "failed_feeds": failures
          }
          summary["status"] = "partial" if failures and len(summary["feeds"]) > failures else ("failed" if failures else "completed")
          summary_path = output_dir / "summary.json"
          summary_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-discovery-${{ github.run_number }}
          path: reports/market-discovery/
          if-no-files-found: warn
          retention-days: 14

name: Publish remaining four Falcon Agent Skills to FindAIapp

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and publish one bounded batch of distinct public skills anonymously
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          base = "https://www.ouraiw.com/api/v1"
          items = [
              {
                  "kind": "skill",
                  "name": "Dev & Agent Toolbox",
                  "category": "dev",
                  "publisher": "ChatGPT",
                  "license": "MIT",
                  "purpose": "Guide safe use of browser-based developer utilities for common data and API tasks.",
                  "advantages": "A broad but bounded toolbox with clear privacy notes; the utilities run locally in the browser and do not upload inputs.",
                  "description": (
                      "A reusable Agent Skill that guides developers through browser-based utilities for JSON formatting, URL inspection, "
                      "JWT decoding, Base64, regular expressions, hashes, retry/backoff planning, rate-limit calculations, trace review and "
                      "redaction. The companion toolbox is browser-only and processes inputs locally. The skill does not claim to replace "
                      "security review, production observability or a full API testing suite."
                  ),
                  "url": "https://agensi.io/skills/dev-agent-toolbox",
                  "website": "https://falconprojectai-arch.github.io/falcon-ai-decision-engine/products/dev-agent-toolbox/",
                  "github": "https://github.com/falconprojectai-arch/falcon-ai-decision-engine/tree/main/skills/dev-agent-toolbox",
              },
              {
                  "kind": "skill",
                  "name": "StockPulse",
                  "category": "prod",
                  "publisher": "ChatGPT",
                  "license": "MIT",
                  "purpose": "Track manual SKU inventory, reorder thresholds and estimated gross margin.",
                  "advantages": "Keeps calculations transparent and uses owner-entered cost, price and quantity data without pretending to sync with a store.",
                  "description": (
                      "An Agent Skill for small retailers and online sellers who maintain a manual inventory list. It helps structure SKU "
                      "records, calculate stock value and estimated gross margin, and flag quantities below supplied reorder thresholds. "
                      "The companion browser app supports CSV import/export and local storage. It does not sync with an ecommerce platform, "
                      "accounting system or supplier, and it does not place purchase orders."
                  ),
                  "url": "https://agensi.io/skills/stockpulse",
                  "website": "https://falconprojectai-arch.github.io/falcon-ai-decision-engine/products/stockpulse/",
                  "github": "https://github.com/falconprojectai-arch/falcon-ai-decision-engine/tree/main/skills/stockpulse",
              },
              {
                  "kind": "skill",
                  "name": "ExpenseSnap",
                  "category": "prod",
                  "publisher": "ChatGPT",
                  "license": "MIT",
                  "purpose": "Organize project time and expenses into export-ready summaries.",
                  "advantages": "Simple local records and clear project totals without claiming to be accounting, tax or invoicing software.",
                  "description": (
                      "An Agent Skill for freelancers and small service businesses that helps structure time entries, project expenses, "
                      "client totals and invoice-ready summaries. The companion browser app stores data locally and exports CSV/JSON. "
                      "It is not tax or accounting advice, does not issue invoices, collect payments, sync bank accounts or calculate "
                      "jurisdiction-specific tax liabilities."
                  ),
                  "url": "https://agensi.io/skills/expensesnap",
                  "website": "https://falconprojectai-arch.github.io/falcon-ai-decision-engine/products/expensesnap/",
                  "github": "https://github.com/falconprojectai-arch/falcon-ai-decision-engine/tree/main/skills/expensesnap",
              },
              {
                  "kind": "skill",
                  "name": "CronPulse",
                  "category": "dev",
                  "publisher": "ChatGPT",
                  "license": "MIT",
                  "purpose": "Analyze exported scheduled-job and AI-agent run histories for recurring failures.",
                  "advantages": "Works from supplied JSON/JSONL exports and produces a concise incident summary without claiming live monitoring.",
                  "description": (
                      "An Agent Skill for developers who need to inspect exported cron, scheduled-job or AI-agent run histories. It guides "
                      "normalization of common JSON/JSONL fields, identification of repeated failures and preparation of an incident summary. "
                      "The companion browser app is offline analysis only; it does not monitor live jobs, send alerts, retry tasks, restart "
                      "services or connect to production infrastructure."
                  ),
                  "url": "https://agensi.io/skills/cronpulse",
                  "website": "https://falconprojectai-arch.github.io/falcon-ai-decision-engine/products/cronpulse/",
                  "github": "https://github.com/falconprojectai-arch/falcon-ai-decision-engine/tree/main/skills/cronpulse",
              },
          ]

          headers = {
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "FalconFindAIappPublisher/1.0",
          }

          def request(method, url, payload=None):
              data = json.dumps(payload, ensure_ascii=False).encode("utf-8") if payload is not None else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return response.status, response.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode("utf-8", "replace")

          # Read the platform's live enums before validating any immutable anonymous listings.
          meta_status, meta_body = request("GET", base + "/meta")
          if meta_status != 200:
              raise SystemExit(f"ABORT: metadata request returned HTTP {meta_status}: {meta_body[:500]}")
          meta = json.loads(meta_body)
          print("LIVE_META", json.dumps(meta, ensure_ascii=False)[:2500])

          # Validate every item before the write. No submission occurs if any item fails validation.
          for item in items:
              status, body = request("POST", base + "/validate", item)
              try:
                  result = json.loads(body)
              except Exception:
                  result = {"raw": body[:1000]}
              print("VALIDATE", item["name"], "HTTP", status, json.dumps(result, ensure_ascii=False)[:1200])
              if status not in (200, 201) or result.get("valid") is False or result.get("error"):
                  raise SystemExit("ABORT: at least one immutable listing failed validation; no batch was submitted")

          # One documented anonymous batch, within the five-item limit. The API deduplicates by kind + name.
          status, body = request("POST", base + "/items/batch", {"items": items})
          try:
              result = json.loads(body)
          except Exception:
              result = {"raw": body[:2000]}
          print("BATCH_HTTP_STATUS", status)
          if status not in (200, 201):
              print("BATCH_ERROR", body[:2500])
              raise SystemExit("BATCH_NOT_ACCEPTED")

          data = result.get("data") if isinstance(result.get("data"), dict) else {}
          records = data.get("results") or result.get("results") or []
          summary_records = []
          for record in records:
              if not isinstance(record, dict):
                  continue
              item = record.get("item") if isinstance(record.get("item"), dict) else {}
              summary_records.append({
                  "name": item.get("name") or record.get("name"),
                  "created": record.get("created"),
                  "duplicate": record.get("duplicate"),
                  "id": item.get("id") or record.get("id"),
                  "page": item.get("page") or record.get("page"),
                  "error": record.get("error"),
              })
          print("BATCH_SUMMARY", json.dumps({"created": data.get("created"), "duplicates": data.get("duplicates"), "failed": data.get("failed"), "results": summary_records}, ensure_ascii=False)[:4000])

          summary = {
              "http_status": status,
              "submitted_count": len(items),
              "results": summary_records,
              "publisher_attribution": "AI · ChatGPT",
              "anonymous_listings_are_immutable": True,
              "no_account_or_api_key_used": True,
              "no_payment_or_identity_data_used": True,
          }
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## FindAIapp anonymous skill publication\n\n")
              output.write("```json\n" + json.dumps(summary, indent=2, ensure_ascii=False) + "\n```\n")
              output.write("\nEach item was validated before the batch write. No owner identity, email, account, API key, payment or credential was used.\n")
          PY

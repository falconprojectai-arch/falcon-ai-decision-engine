name: Bootstrap Falcon Payment Orders D1

on:
  push:
    paths:
      - ".github/workflows/cloudflare-d1-bootstrap.yml"

permissions:
  contents: read

jobs:
  create-or-reuse-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Cloudflare D1 access and create database if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          code="$(curl -sS -o /tmp/d1-list.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")"
          if [ "$code" != "200" ]; then
            echo "D1 list permission check failed (HTTP $code). No database was created."
            jq -c '{success,errors}' /tmp/d1-list.json || true
            exit 1
          fi
          jq -e '.success == true' /tmp/d1-list.json >/dev/null

          db_id="$(jq -r '.result[]? | select(.name == "falcon-payment-orders") | .uuid' /tmp/d1-list.json | head -n1)"
          if [ -z "$db_id" ]; then
            code="$(curl -sS -o /tmp/d1-create.json -w '%{http_code}' \
              -X POST "$api" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"falcon-payment-orders","primary_location_hint":"weur","read_replication":{"mode":"disabled"}}')"
            if [ "$code" != "200" ]; then
              echo "D1 create failed (HTTP $code)."
              jq -c '{success,errors}' /tmp/d1-create.json || true
              exit 1
            fi
            jq -e '.success == true and (.result.uuid | type == "string")' /tmp/d1-create.json >/dev/null
            db_id="$(jq -r '.result.uuid' /tmp/d1-create.json)"
            echo "Created D1 database falcon-payment-orders."
          else
            echo "Reusing existing D1 database falcon-payment-orders."
          fi

          echo "D1_DATABASE_ID=$db_id" >> "$GITHUB_OUTPUT"
        id: d1

      - name: Publish non-secret database result
        env:
          DB_ID: ${{ steps.d1.outputs.D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          echo "D1 database operation completed."
          echo "Database name: falcon-payment-orders"
          echo "Database ID: $DB_ID"
          echo "No customer data or payment activity was created."

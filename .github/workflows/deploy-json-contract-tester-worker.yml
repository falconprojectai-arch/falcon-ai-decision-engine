name: Deploy JSON Contract Tester Worker

on:
  push:
    paths:
      - "products/json-contract-tester-api/**"
      - ".github/workflows/deploy-json-contract-tester-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live Worker GET endpoints
        env:
          WORKER_URL: https://json-contract-tester-api.falcon-project-ai.workers.dev
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors --retry-delay 2 -fsS "$WORKER_URL/health" \
            | jq -e '.status == "ok" and .service == "json-contract-tester-api"'
          curl --retry 3 --retry-all-errors --retry-delay 2 -fsS "$WORKER_URL/.well-known/x402" \
            | jq -e '.resources[] | select(.path == "/v1/validate-batch" and .method == "POST")'
          curl --retry 3 --retry-all-errors --retry-delay 2 -fsS "$WORKER_URL/openapi.json" \
            | jq -e '.paths["/v1/validate-batch"].post != null'

      - name: Verify x402 discovery challenges without paying
        env:
          WORKER_URL: https://json-contract-tester-api.falcon-project-ai.workers.dev
        run: |
          set -euo pipefail
          for method in GET HEAD; do
            status="$(curl -sS -o /tmp/x402-$method-body.txt -D /tmp/x402-$method-headers.txt -w '%{http_code}' -X "$method" "$WORKER_URL/v1/validate-batch")"
            if [ "$status" != "402" ] || ! grep -qi '^payment-required:' /tmp/x402-$method-headers.txt; then
              echo "Expected $method HTTP 402 with PAYMENT-REQUIRED; received HTTP $status."
              cat /tmp/x402-$method-body.txt
              exit 1
            fi
            echo "$method discovery challenge passed; no payment was sent."
          done

          status="$(curl -sS -o /tmp/x402-post-body.txt -D /tmp/x402-post-headers.txt -w '%{http_code}' \
            -X POST "$WORKER_URL/v1/validate-batch" \
            -H 'Content-Type: application/json' \
            --data '{"schema":{"type":"object"},"outputs":[{"json":{}}]}')"
          if [ "$status" != "402" ] || ! grep -qi '^payment-required:' /tmp/x402-post-headers.txt; then
            echo "Expected POST HTTP 402 with PAYMENT-REQUIRED; received HTTP $status."
            cat /tmp/x402-post-body.txt
            exit 1
          fi
          echo "POST buyer challenge passed; no payment was sent."

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: products/json-contract-tester-api
        run: npm install --no-audit --no-fund

      - name: Run API unit tests
        working-directory: products/json-contract-tester-api
        run: npm test

      - name: Validate Worker bundle
        working-directory: products/json-contract-tester-api
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Require production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Deployment blocked: missing GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Deploy Worker
        working-directory: products/json-contract-tester-api
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # PAY_TO is intentionally kept as a Cloudflare Worker secret, not copied into GitHub.
      # The independent public smoke test verifies that the existing payment receiver is configured.

      - name: Verify production health and x402 challenge
        env:
          WORKER_URL: https://json-contract-tester-api.falcon-project-ai.workers.dev
        run: |
          set -euo pipefail
          echo "Checking Worker health..."
          health="$(curl --retry 5 --retry-all-errors --retry-delay 3 -fsS "$WORKER_URL/health")"
          echo "$health" | jq -e '.status == "ok" and .service == "json-contract-tester-api"'

          echo "Checking discovery manifest..."
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsS "$WORKER_URL/.well-known/x402" \
            | jq -e '.resources[] | select(.path == "/v1/validate-batch" and .method == "POST")'
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsS "$WORKER_URL/.well-known/x402.json" \
            | jq -e '(.x402Version == 2) and (.resources[] | select(.url == (env.WORKER_URL + "/v1/validate-batch") and .accepts[0].amount == "5000" and .extensions.bazaar.info.input.method == "POST" and .outputSchema.properties.valid.type == "boolean"))'

          echo "Checking OpenAPI document..."
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsS "$WORKER_URL/openapi.json" \
            | jq -e '.paths["/v1/validate-batch"].post != null'

          echo "Checking that protected POST returns an x402 payment challenge (no payment is sent)..."
          status="$(curl -sS -o /tmp/x402-body.txt -D /tmp/x402-headers.txt -w '%{http_code}' \
            -X POST "$WORKER_URL/v1/validate-batch" \
            -H 'Content-Type: application/json' \
            --data '{"schema":{"type":"object"},"outputs":[{"json":{}}]}')"
          if [ "$status" != "402" ] || ! grep -qi '^payment-required:' /tmp/x402-headers.txt; then
            echo "Expected HTTP 402 with PAYMENT-REQUIRED header; received HTTP $status."
            cat /tmp/x402-body.txt
            cat /tmp/x402-headers.txt
            exit 1
          fi
          echo "Checking legacy accepts[] body for x402 directory compatibility..."
          status="$(curl -sS -o /tmp/x402-get-body.txt -D /tmp/x402-get-headers.txt -w '%{http_code}' -X GET "$WORKER_URL/v1/validate-batch")"
          if [ "$status" != "402" ] || ! grep -qi '^payment-required:' /tmp/x402-get-headers.txt; then
            echo "Expected GET HTTP 402 with PAYMENT-REQUIRED; received HTTP $status."
            cat /tmp/x402-get-body.txt
            exit 1
          fi
          jq -e '.accepts[0].scheme == "exact" and .accepts[0].network == "eip155:8453" and .accepts[0].amount == "5000" and .extensions.bazaar.info.input.method == "POST"' /tmp/x402-get-body.txt

          echo "Checking empty-body POST marketplace probe..."
          status="$(curl -sS -o /tmp/x402-empty-post-body.txt -D /tmp/x402-empty-post-headers.txt -w '%{http_code}' -X POST "$WORKER_URL/v1/validate-batch")"
          if [ "$status" != "402" ] || ! grep -qi '^payment-required:' /tmp/x402-empty-post-headers.txt; then
            echo "Expected empty POST HTTP 402 with PAYMENT-REQUIRED; received HTTP $status."
            cat /tmp/x402-empty-post-body.txt
            exit 1
          fi
          jq -e '.accepts[0].scheme == "exact" and .accepts[0].amount == "5000"' /tmp/x402-empty-post-body.txt
          echo "Production smoke tests passed."

      # Free Agent402 registration refresh: re-crawl the public x402 manifest and
      # OpenAPI after every Worker deploy. This improves discovery metadata only;
      # it does not create or simulate a paid settlement.
      - name: Refresh Agent402 seller listing
        env:
          WORKER_URL: https://json-contract-tester-api.falcon-project-ai.workers.dev
        run: |
          set -euo pipefail
          echo "Refreshing the free Agent402 seller index..."
          status="$(curl --silent --show-error -o /tmp/agent402-register.json -w '%{http_code}' \
            -X POST https://agent402.tools/api/index/register \
            -H 'content-type: application/json' \
            --data "$(jq -n --arg origin "$WORKER_URL" '{origin: $origin}')")"
          if [ "$status" = "429" ]; then
            echo "Agent402 rate limit reached; the existing seller listing is left intact."
            cat /tmp/agent402-register.json
          elif [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
            cat /tmp/agent402-register.json | jq .
            echo "Verifying refreshed public seller metadata..."
            curl --retry 5 --retry-all-errors --retry-delay 3 -fsS \
              "https://agent402.tools/api/index?seller=$WORKER_URL" \
              | jq -e --arg origin "$WORKER_URL" '
                  .origin == $origin
                  and .routable == true
                  and any(.tools[]; .route == "/v1/validate-batch"
                    and ((.tags // []) | index("api-response-validation") != null))
                '
          else
            echo "Agent402 registration failed with HTTP $status."
            cat /tmp/agent402-register.json
            exit 1
          fi

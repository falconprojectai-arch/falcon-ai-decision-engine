name: Deploy JSON Contract Tester Worker

on:
  push:
    branches: ["main"]
    paths:
      - "products/json-contract-tester-api/**"
      - ".github/workflows/deploy-json-contract-tester-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live Worker health and public API contract
        env:
          WORKER_URL: https://json-contract-tester-api.falcon-project-ai.workers.dev
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors --retry-delay 2 -fsS "$WORKER_URL/health" \
            | jq -e '.status == "ok" and .service == "json-contract-tester-api"'
          curl --retry 3 --retry-all-errors --retry-delay 2 -fsS "$WORKER_URL/openapi.json" \
            | jq -e '.paths["/v1/validate-batch"].post != null'
          for path in /.well-known/x402 /.well-known/x402.json; do
            status="$(curl -sS -o /tmp/manifest-body.txt -w '%{http_code}' "$WORKER_URL$path")"
            if [ "$status" != "503" ] || ! grep -q 'Payments are disabled pending receiver verification' /tmp/manifest-body.txt; then
              echo "Expected $path to remain paused with HTTP 503; received HTTP $status."
              cat /tmp/manifest-body.txt
              exit 1
            fi
          done

      - name: Verify payment pause without sending funds
        env:
          WORKER_URL: https://json-contract-tester-api.falcon-project-ai.workers.dev
        run: |
          set -euo pipefail
          for path in /.well-known/x402 /.well-known/x402.json /v1/validate-batch; do
            status="$(curl -sS -o /tmp/paused-body.txt -w '%{http_code}' "$WORKER_URL$path")"
            if [ "$status" != "503" ] || ! grep -q 'Payments are disabled pending receiver verification' /tmp/paused-body.txt; then
              echo "Expected $path to return the explicit payment-pause HTTP 503; received HTTP $status."
              cat /tmp/paused-body.txt
              exit 1
            fi
            echo "$path is safely paused (HTTP 503)."
          done
          status="$(curl -sS -o /tmp/paused-post-body.txt -w '%{http_code}' \
            -X POST "$WORKER_URL/v1/validate-batch" \
            -H 'Content-Type: application/json' \
            --data '{"schema":{"type":"object"},"outputs":[{"json":{}}]}')"
          if [ "$status" != "503" ] || ! grep -q 'Payments are disabled pending receiver verification' /tmp/paused-post-body.txt; then
            echo "Expected paid POST to remain disabled with HTTP 503; received HTTP $status."
            cat /tmp/paused-post-body.txt
            exit 1
          fi
          echo "Paid POST remains disabled; no payment was sent."

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: products/json-contract-tester-api
        run: npm install --no-audit --no-fund

      - name: Run API unit tests
        working-directory: products/json-contract-tester-api
        run: npm test

      - name: Validate Worker bundle
        working-directory: products/json-contract-tester-api
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Require production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Deployment blocked: missing GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Deploy Worker
        working-directory: products/json-contract-tester-api
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # PAY_TO is intentionally kept as a Cloudflare Worker secret, not copied into GitHub.
      # The independent public smoke test verifies that the existing payment receiver is configured.

      - name: Verify live wallet challenge, signature, and replay protection
        working-directory: products/json-contract-tester-api
        env:
          WORKER_URL: https://json-contract-tester-api.falcon-project-ai.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { privateKeyToAccount } from 'viem/accounts';

          // Public, deterministic test-only key. It must never hold funds.
          const account = privateKeyToAccount('0x' + '0'.repeat(63) + '1');
          const post = async (path, body) => fetch(new URL(path, process.env.WORKER_URL), {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(body)
          });

          const challengeResponse = await post('/v1/auth/challenge', { address: account.address });
          assert.equal(challengeResponse.status, 200, 'challenge endpoint must be live');
          const challenge = await challengeResponse.json();
          assert.equal(challenge.address.toLowerCase(), account.address.toLowerCase());
          assert.equal(challenge.chainId, 8453);
          assert.equal(challenge.purpose, 'wallet_ownership_proof_only');
          assert.equal(challenge.paymentAuthorized, false);
          assert.ok(Date.parse(challenge.expiresAt) > Date.now());

          const wrongSignature = await account.signMessage({ message: 'not the issued challenge' });
          const rejected = await post('/v1/auth/verify', {
            address: account.address, nonce: challenge.nonce,
            message: challenge.message, signature: wrongSignature
          });
          assert.equal(rejected.status, 401, 'wrong message signature must be rejected');

          const signature = await account.signMessage({ message: challenge.message });
          const proof = {
            address: account.address, nonce: challenge.nonce,
            message: challenge.message, signature
          };
          const verifiedResponse = await post('/v1/auth/verify', proof);
          assert.equal(verifiedResponse.status, 200, 'valid wallet proof must verify');
          const verified = await verifiedResponse.json();
          assert.equal(verified.verified, true);
          assert.equal(verified.paymentAuthorized, false);
          assert.equal(verified.sessionCreated, false);

          const replay = await post('/v1/auth/verify', proof);
          assert.ok([401, 409].includes(replay.status), 'replayed challenge must be rejected');
          console.log('Live wallet proof passed: challenge, wrong-signature rejection, valid signature, and replay rejection.');
          NODE

      - name: Verify production health and x402 challenge
        env:
          WORKER_URL: https://json-contract-tester-api.falcon-project-ai.workers.dev
        run: |
          set -euo pipefail
          echo "Checking Worker health..."
          health="$(curl --retry 5 --retry-all-errors --retry-delay 3 -fsS "$WORKER_URL/health")"
          echo "$health" | jq -e '.status == "ok" and .service == "json-contract-tester-api"'

          echo "Checking x402 discovery is disabled until receiver verification..."
          for path in /.well-known/x402 /.well-known/x402.json; do
            status="$(curl -sS -o /tmp/manifest-body.txt -w '%{http_code}' "$WORKER_URL$path")"
            if [ "$status" != "503" ] || ! grep -q 'Payments are disabled pending receiver verification' /tmp/manifest-body.txt; then
              echo "Expected $path HTTP 503 with payment-pause message; received HTTP $status."
              cat /tmp/manifest-body.txt
              exit 1
            fi
          done

          echo "Checking OpenAPI document remains available..."
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsS "$WORKER_URL/openapi.json" \
            | jq -e '.paths["/v1/validate-batch"].post != null'

          echo "Checking paid POST remains disabled..."
          status="$(curl -sS -o /tmp/paused-post-body.txt -w '%{http_code}' \
            -X POST "$WORKER_URL/v1/validate-batch" \
            -H 'Content-Type: application/json' \
            --data '{"schema":{"type":"object"},"outputs":[{"json":{}}]}')"
          if [ "$status" != "503" ] || ! grep -q 'Payments are disabled pending receiver verification' /tmp/paused-post-body.txt; then
            echo "Expected HTTP 503 payment pause; received HTTP $status."
            cat /tmp/paused-post-body.txt
            exit 1
          fi
          echo "Production payment-pause checks passed."

      # Do not refresh paid marketplace listings while the Worker is fail-closed.
      - name: Keep Agent402 seller listing unchanged while payments are paused
        run: echo "Payments are paused pending receiver verification; no paid marketplace listing refresh was attempted."

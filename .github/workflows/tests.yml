name: Test Revenue Machine

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run Python tests
        id: pytest
        run: python -m pytest -q --junitxml=pytest-results.xml
        continue-on-error: true
      - name: Annotate Python test failures
        if: steps.pytest.outcome == 'failure'
        run: python scripts/emit_pytest_annotations.py pytest-results.xml
      - name: Run JSON Contract Tester JUnit tests
        id: node_tests
        run: node --test products/json-contract-tester/test/junit-export.test.js
        continue-on-error: true
      - name: Fail if any test suite failed
        if: always()
        run: |
          if [ "${{ steps.pytest.outcome }}" != "success" ] || [ "${{ steps.node_tests.outcome }}" != "success" ]; then
            echo "::error title=Test suites failed::Inspect the pytest annotations and Node test output above."
            exit 1
          fi

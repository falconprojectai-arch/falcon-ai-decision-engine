name: Test Revenue Machine

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run JSON Contract Tester JUnit tests
        run: node --test products/json-contract-tester/test/junit-export.test.js

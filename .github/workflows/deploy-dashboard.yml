name: Deploy control dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - "products/json-contract-tester/**"
      - "products/dev-agent-toolbox/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stamp dashboard change time
        run: |
          timestamp="$(git log -1 --format=%cI -- dashboard/index.html)"
          if [ -z "$timestamp" ]; then
            echo "Could not determine dashboard change timestamp" >&2
            exit 1
          fi
          python - "$timestamp" <<'PY'
          from pathlib import Path
          import sys
          path = Path("dashboard/index.html")
          content = path.read_text(encoding="utf-8")
          content = content.replace("__DASHBOARD_UPDATED_AT__", sys.argv[1])
          if "__DASHBOARD_UPDATED_AT__" in content:
              raise SystemExit("Timestamp placeholder was not replaced")
          path.write_text(content, encoding="utf-8")
          PY
      - name: Assemble Pages site
        run: |
          set -eu
          rm -rf site
          mkdir -p site/products/json-contract-tester site/products/dev-agent-toolbox
          cp -R dashboard/. site/
          cp products/json-contract-tester/index.html site/products/json-contract-tester/index.html
          cp products/dev-agent-toolbox/index.html site/products/dev-agent-toolbox/index.html
      - name: Upload dashboard and product
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Install browser-test dependencies
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Smoke-test deployed product in Chromium
        env:
          PRODUCT_URL: ${{ steps.deployment.outputs.page_url }}products/json-contract-tester/
        run: |
          python - <<'PY'
          import asyncio
          import os
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()
                  errors = []
                  page.on("pageerror", lambda error: errors.append(str(error)))
                  response = await page.goto(os.environ["PRODUCT_URL"], wait_until="networkidle", timeout=60000)
                  assert response and response.status == 200, f"Unexpected HTTP response: {response.status if response else 'none'}"
                  assert await page.title() == "JSON Contract Tester — Validate AI and API Outputs"
                  assert await page.locator("#status").inner_text() == "1 of 3 outputs passed. No data was uploaded."
                  assert await page.locator(".result.pass").count() == 1
                  assert await page.locator(".result.fail").count() == 2

                  await page.locator("#schema").fill('{"const":{"a":1,"b":2}}')
                  await page.locator("#cases").fill('{"b":2,"a":1}')
                  await page.get_by_role("button", name="Run contract tests").click()
                  assert await page.locator("#status").inner_text() == "1 of 1 outputs passed. No data was uploaded."

                  await page.locator("#schema").fill("{")
                  await page.get_by_role("button", name="Run contract tests").click()
                  assert (await page.locator("#status").inner_text()).startswith("Schema error:")
                  assert await page.evaluate("window.lastContractReport") is None
                  assert not errors, f"Browser JavaScript errors: {errors}"
                  await browser.close()

          asyncio.run(main())
          PY

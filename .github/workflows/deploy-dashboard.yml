name: Deploy control dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - "llms.txt"
      - "products/json-contract-tester/**"
      - "products/dev-agent-toolbox/**"
      - "products/json-contract-tester-api/**"
      - "products/index.html"
      - "products/marketplace-hub.html"
      - "products/launch-guide.md"
      - "products/localbiz-followup/**"
      - "products/stockpulse/**"
      - "products/mcpguard-lite/**"
      - "products/expensesnap/**"
      - "products/cronpulse/**"
      - "products/ecu-workshop-forms/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stamp dashboard change time
        run: |
          timestamp="$(git log -1 --format=%cI -- dashboard/index.html)"
          if [ -z "$timestamp" ]; then
            echo "Could not determine dashboard change timestamp" >&2
            exit 1
          fi
          python - "$timestamp" <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import re
          import sys

          path = Path("dashboard/index.html")
          content = path.read_text(encoding="utf-8")
          local_time = datetime.fromisoformat(sys.argv[1]).astimezone(ZoneInfo("Asia/Tehran"))
          iso_time = local_time.isoformat(timespec="seconds")
          label = local_time.strftime("%Y-%m-%d، %H:%M تهران").translate(
              str.maketrans("0123456789", "۰۱۲۳۴۵۶۷۸۹")
          )
          content, count = re.subn(
              r'<time id="last-updated" datetime="[^"]*">.*?</time>',
              f'<time id="last-updated" datetime="{iso_time}">{label}</time>',
              content,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"Expected one dashboard timestamp element; found {count}")
          path.write_text(content, encoding="utf-8")
          PY
      - name: Assemble Pages site
        run: |
          set -eu
          rm -rf site
          mkdir -p site/products/json-contract-tester site/products/dev-agent-toolbox site/products/json-contract-tester-api site/products/localbiz-followup site/products/stockpulse site/products/mcpguard-lite site/products/expensesnap site/products/cronpulse site/products/ecu-workshop-forms
          cp -R dashboard/. site/
          cp llms.txt site/llms.txt
          cp products/json-contract-tester/index.html site/products/json-contract-tester/index.html
          cp products/json-contract-tester/app.js site/products/json-contract-tester/app.js
          cp products/json-contract-tester/junit-export.js site/products/json-contract-tester/junit-export.js
          cp products/json-contract-tester/styles.css site/products/json-contract-tester/styles.css
          cp products/dev-agent-toolbox/index.html site/products/dev-agent-toolbox/index.html
          cp products/dev-agent-toolbox/payment.html site/products/dev-agent-toolbox/payment.html
          cp products/dev-agent-toolbox/contract-review-checklist.html site/products/dev-agent-toolbox/contract-review-checklist.html
          cp products/dev-agent-toolbox/blockchain-infrastructure.html site/products/dev-agent-toolbox/blockchain-infrastructure.html
          cp products/dev-agent-toolbox/agent-integration-patterns.html site/products/dev-agent-toolbox/agent-integration-patterns.html
          cp products/dev-agent-toolbox/agent-marketplaces.html site/products/dev-agent-toolbox/agent-marketplaces.html
          cp products/json-contract-tester-api/payment-preflight.html site/products/json-contract-tester-api/payment-preflight.html
          cp products/index.html site/products/index.html
          cp products/marketplace-hub.html site/products/marketplace-hub.html
          cp products/localbiz-followup/index.html site/products/localbiz-followup/index.html
          cp products/stockpulse/index.html site/products/stockpulse/index.html
          cp products/mcpguard-lite/index.html site/products/mcpguard-lite/index.html
          cp products/expensesnap/index.html site/products/expensesnap/index.html
          cp products/cronpulse/index.html site/products/cronpulse/index.html
          cp products/ecu-workshop-forms/index.html site/products/ecu-workshop-forms/index.html
          cp products/launch-guide.md site/products/launch-guide.md
          cp products/localbiz-followup/preview.svg site/products/localbiz-followup/preview.svg
          cp products/stockpulse/preview.svg site/products/stockpulse/preview.svg
          cp products/mcpguard-lite/preview.svg site/products/mcpguard-lite/preview.svg
          cp products/expensesnap/preview.svg site/products/expensesnap/preview.svg
          cp products/cronpulse/preview.svg site/products/cronpulse/preview.svg
      - name: Install browser-test dependencies
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Capture real product screenshots with synthetic data
        run: |
          python - <<'PY'
          import asyncio, subprocess, sys, time
          from playwright.async_api import async_playwright

          server = subprocess.Popen([sys.executable, "-m", "http.server", "8765", "--directory", "site"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              time.sleep(2)
              async def main():
                  async with async_playwright() as p:
                      browser = await p.chromium.launch()
                      async def capture(slug, setup):
                          page = await browser.new_page(viewport={"width": 1440, "height": 1000}, device_scale_factor=1)
                          response = await page.goto(f"http://127.0.0.1:8765/products/{slug}/", wait_until="networkidle", timeout=60000)
                          assert response and response.status == 200, f"{slug}: page did not load"
                          await setup(page)
                          await page.screenshot(path=f"site/products/{slug}/screenshot.png", full_page=True, animations="disabled")
                          await page.close()
                      async def localbiz(page):
                          await page.locator("#name").fill("Northside Cafe")
                          await page.locator("#contact").fill("+15555550123")
                          await page.locator("#need").fill("Website enquiry")
                          await page.locator("#leadForm button[type=submit]").click()
                          await page.locator("#rows button").first.click()
                      async def stock(page):
                          await page.locator("#sku").fill("SKU-104")
                          await page.locator("#name").fill("Coffee beans")
                          await page.locator("#qty").fill("4")
                          await page.locator("#min").fill("10")
                          await page.locator("#cost").fill("8")
                          await page.locator("#price").fill("14")
                          await page.locator("#form button[type=submit]").click()
                      async def guard(page):
                          await page.get_by_role("button", name="Load sample").click()
                          await page.get_by_role("button", name="Scan configuration").click()
                      async def expense(page):
                          await page.locator("#date").fill("2026-11-04")
                          await page.locator("#project").fill("Northside Cafe")
                          await page.locator("#quantity").fill("2")
                          await page.locator("#rate").fill("50")
                          await page.locator("#entryForm button[type=submit]").click()
                      async def cron(page):
                          await page.get_by_role("button", name="Load sample").click()
                          await page.get_by_role("button", name="Analyze runs").click()
                      await capture("localbiz-followup", localbiz)
                      await capture("stockpulse", stock)
                      await capture("mcpguard-lite", guard)
                      await capture("expensesnap", expense)
                      await capture("cronpulse", cron)
                      await browser.close()
              asyncio.run(main())
          finally:
              server.terminate()
              server.wait(timeout=10)
          PY
      - name: Upload dashboard and product
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test deployed dashboard in Chromium
        env:
          DASHBOARD_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import asyncio
          import os
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()
                  errors = []
                  page.on("pageerror", lambda error: errors.append(str(error)))
                  response = await page.goto(os.environ["DASHBOARD_URL"], wait_until="networkidle", timeout=60000)
                  assert response and response.status == 200
                  timestamp = await page.locator("#last-updated").get_attribute("datetime")
                  assert timestamp and "2026-11-02T04:20:00" not in timestamp
                  assert "اتاق کنترل پروژه درآمد خودکار" in await page.locator("body").inner_text()
                  assert not errors, f"Browser JavaScript errors: {errors}"
                  await browser.close()

          asyncio.run(main())
          PY
      - name: Smoke-test developer toolbox in Chromium
        env:
          TOOLBOX_URL: ${{ steps.deployment.outputs.page_url }}products/dev-agent-toolbox/
        run: |
          python - <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()
                  errors = []
                  page.on("pageerror", lambda error: errors.append(str(error)))
                  response = await page.goto(os.environ["TOOLBOX_URL"], wait_until="networkidle", timeout=60000)
                  assert response and response.status == 200
                  assert await page.locator(".tool").count() == 20
                  await page.get_by_role("button", name="2. Semantic JSON Diff").click()
                  await page.get_by_role("button", name="Run tool").click()
                  assert "changed" in await page.locator("#result").inner_text()
                  await page.get_by_role("button", name="8. UUID Generator").click()
                  await page.get_by_role("button", name="Run tool").click()
                  assert len((await page.locator("#result").inner_text()).splitlines()) == 5
                  assert not errors, f"Browser JavaScript errors: {errors}"
                  await browser.close()
          asyncio.run(main())
          PY
      - name: Smoke-test payment page in Chromium
        env:
          PAYMENT_URL: ${{ steps.deployment.outputs.page_url }}products/dev-agent-toolbox/payment.html
        run: |
          python - <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()
                  errors = []
                  page.on("pageerror", lambda error: errors.append(str(error)))
                  response = await page.goto(os.environ["PAYMENT_URL"], wait_until="networkidle", timeout=60000)
                  assert response and response.status == 200, f"Unexpected HTTP response: {response.status if response else 'none'}"
                  assert await page.title() == "API & Agent Contract Review — Payment"
                  assert await page.get_by_text("TD8c7KQc1qQrsBZVUF9F7aseZd1RPC9NPq").count() == 1
                  assert await page.get_by_text("0xd243c3278707d7bee006e8b3f3105586bbf9667a").count() == 1
                  assert await page.locator("#tx-form").count() == 1
                  assert await page.locator("#txid").count() == 1
                  assert await page.locator("#contact").count() == 1
                  assert await page.get_by_role("button", name="Prepare payment confirmation").count() == 1
                  assert not errors, f"Browser JavaScript errors: {errors}"
                  await browser.close()

          asyncio.run(main())
          PY
      - name: Smoke-test deployed product in Chromium
        env:
          PRODUCT_URL: ${{ steps.deployment.outputs.page_url }}products/json-contract-tester/
        run: |
          python - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()
                  errors = []
                  asset_status = {"styles.css": None, "junit-export.js": None, "app.js": None}
                  def record_asset(response):
                      for asset in asset_status:
                          if response.url.endswith("/" + asset):
                              asset_status[asset] = response.status
                  page.on("response", record_asset)
                  page.on("pageerror", lambda error: errors.append(str(error)))
                  response = await page.goto(os.environ["PRODUCT_URL"], wait_until="networkidle", timeout=60000)
                  assert response and response.status == 200, f"Unexpected HTTP response: {response.status if response else 'none'}"
                  assert await page.title() == "JSON Contract Tester — Validate AI and API Outputs"
                  assert all(status == 200 for status in asset_status.values()), f"Product assets failed to load: {asset_status}"
                  # The four-case fixture is intentionally loaded through the public sample button.
                  await page.get_by_role("button", name="Load sample").click()
                  await page.get_by_role("button", name="Run contract tests").click()
                  assert await page.locator("#status").inner_text() == "1 of 4 outputs passed. No data was uploaded."
                  assert await page.locator(".result.pass").count() == 1
                  assert await page.locator(".result.fail").count() == 3

                  async with page.expect_download() as download_info:
                      await page.get_by_role("button", name="Download JUnit XML").click()
                  download = await download_info.value
                  assert download.suggested_filename == "contract-test-report.junit.xml"
                  xml_path = await download.path()
                  xml = Path(xml_path).read_text(encoding="utf-8")
                  assert '<testsuites tests="4" failures="3"' in xml
                  assert 'name="sample-1"' in xml and 'name="sample-4"' in xml
                  assert "instancePath:" in xml and "schemaPath:" in xml

                  await page.locator("#schema").fill('{"const":{"a":1,"b":2}}')
                  await page.locator("#cases").fill('{"b":2,"a":1}')
                  await page.get_by_role("button", name="Run contract tests").click()
                  assert await page.locator("#status").inner_text() == "1 of 1 outputs passed. No data was uploaded."

                  await page.locator("#schema").fill("{")
                  await page.get_by_role("button", name="Run contract tests").click()
                  assert (await page.locator("#status").inner_text()).startswith("Schema error:")
                  assert await page.evaluate("window.lastContractReport") is None
                  assert not errors, f"Browser JavaScript errors: {errors}"
                  await browser.close()

          asyncio.run(main())
          PY

      - name: Smoke-test new micro products in Chromium
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright

          async def check(browser, path, title, action):
              page = await browser.new_page()
              errors = []
              page.on("pageerror", lambda error: errors.append(str(error)))
              response = await page.goto(os.environ["PAGES_URL"] + path, wait_until="networkidle", timeout=60000)
              assert response and response.status == 200, f"{path}: HTTP {response.status if response else 'none'}"
              assert await page.title() == title, f"{path}: unexpected title {await page.title()}"
              await action(page)
              assert not errors, f"{path}: browser errors {errors}"
              await page.close()

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  async def follow(page):
                      await page.locator("#name").fill("Email customer")
                      await page.locator("#contact").fill("sample@example.test")
                      await page.locator("#need").fill("Quote")
                      await page.locator("#leadForm button[type=submit]").click()
                      assert await page.locator("#open").inner_text() == "1"
                      await page.locator("#rows button").first.click()
                      assert await page.locator("#whatsapp").is_disabled()
                      await page.locator("#name").fill("WhatsApp customer")
                      await page.locator("#contact").fill("09121234567")
                      await page.locator("#need").fill("Quote")
                      await page.locator("#leadForm button[type=submit]").click()
                      await page.locator("#rows button").nth(2).click()
                      assert await page.locator("#whatsapp").is_enabled()
                      link = await page.locator("#whatsapp").get_attribute("data-url")
                      assert link.startswith("https://wa.me/989121234567?text="), link
                      await page.evaluate("window.open = (url) => { window.__whatsappOpened = url; return null; }")
                      await page.locator("#whatsapp").click()
                      assert await page.evaluate("window.__whatsappOpened") == link
                  async def stock(page):
                      await page.locator("#sku").fill("TEST-1")
                      await page.locator("#name").fill("Test item")
                      await page.locator("#qty").fill("2")
                      await page.locator("#min").fill("5")
                      await page.locator("#form button[type=submit]").click()
                      assert await page.locator("#low").inner_text() == "1"
                  async def guard(page):
                      await page.get_by_role("button", name="Load sample").click()
                      await page.get_by_role("button", name="Scan configuration").click()
                      assert int(await page.locator("#total").inner_text()) >= 1
                      assert int(await page.locator("#high").inner_text()) >= 1
                  await check(browser, "products/localbiz-followup/", "LocalBiz FollowUp — lightweight lead & customer follow-up", follow)
                  await check(browser, "products/stockpulse/", "StockPulse — inventory & reorder calculator", stock)
                  await check(browser, "products/mcpguard-lite/", "MCPGuard Lite — local agent config security checker", guard)
                  await browser.close()
          asyncio.run(main())
          PY

      - name: Smoke-test additional micro products in Chromium
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  errors = []
                  page = await browser.new_page()
                  page.on("pageerror", lambda error: errors.append(str(error)))
                  response = await page.goto(os.environ["PAGES_URL"] + "products/expensesnap/", wait_until="networkidle", timeout=60000)
                  assert response and response.status == 200
                  assert await page.title() == "ExpenseSnap — time & expense tracker"
                  await page.locator("#project").fill("Test client")
                  await page.locator("#rate").fill("50")
                  await page.locator("#quantity").fill("2")
                  await page.locator("#entryForm button[type=submit]").click()
                  assert await page.locator("#hours").inner_text() == "2.00"
                  assert await page.locator("#total").inner_text() == "100.00"
                  await page.close()
                  page = await browser.new_page()
                  page.on("pageerror", lambda error: errors.append(str(error)))
                  response = await page.goto(os.environ["PAGES_URL"] + "products/cronpulse/", wait_until="networkidle", timeout=60000)
                  assert response and response.status == 200
                  assert await page.title() == "CronPulse — agent & scheduled job run analyzer"
                  await page.get_by_role("button", name="Load sample").click()
                  await page.get_by_role("button", name="Analyze runs").click()
                  assert await page.locator("#count").inner_text() == "4"
                  assert await page.locator("#fail").inner_text() == "2"
                  assert not errors, f"Browser JavaScript errors: {errors}"
                  await browser.close()
          asyncio.run(main())
          PY


      - name: Smoke-test product catalogue and preview assets in Chromium
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()
                  errors = []
                  page.on("pageerror", lambda error: errors.append(str(error)))
                  response = await page.goto(os.environ["PAGES_URL"] + "products/", wait_until="networkidle", timeout=60000)
                  assert response and response.status == 200
                  cards = page.locator("article.card")
                  assert await cards.count() == 8
                  images = await cards.locator("img").evaluate_all("(els) => els.map(e => ({src:e.getAttribute('src'), width:e.naturalWidth, complete:e.complete}))")
                  assert len(images) == 5 and all(x["complete"] and x["width"] > 0 and x["src"].endswith("/screenshot.png") for x in images), f"Product screenshots failed: {images}"
                  assert await cards.locator("a[href*='github.com/falconprojectai-arch/falcon-ai-decision-engine/tree/main/products/']").count() == 8
                  statuses = await cards.locator(".status").all_text_contents()
                  assert len(statuses) == 8 and statuses.count("Automated release checks") == 7 and statuses.count("Usage-based API · x402") == 1, f"Unexpected product status labels: {statuses}"
                  guide = await page.request.get(os.environ["PAGES_URL"] + "products/launch-guide.md")
                  assert guide.status == 200, f"Launch guide HTTP {guide.status}"
                  assert "Standard product introduction package" in await guide.text()
                  assert not errors, f"Browser JavaScript errors: {errors}"
                  await browser.close()

          asyncio.run(main())
          PY

      - name: Smoke-test affiliate infrastructure guides in Chromium
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  errors = []
                  page = await browser.new_page()
                  page.on("pageerror", lambda error: errors.append(str(error)))
                  base = os.environ["PAGES_URL"] + "products/dev-agent-toolbox/"
                  response = await page.goto(base + "blockchain-infrastructure.html", wait_until="networkidle", timeout=60000)
                  assert response and response.status == 200
                  assert await page.title() == "Blockchain Infrastructure Checklist for AI Agents | Dev & Agent Toolbox"
                  assert await page.locator('a[rel="sponsored nofollow"][href*="stabledomains.net/?ref=ff6ueixx"]').count() == 1
                  iframe = page.locator('iframe[title="StableDomains domain search"]')
                  assert await iframe.count() == 1
                  assert "ref=ff6ueixx" in await iframe.get_attribute("src")
                  response = await page.goto(base + "agent-integration-patterns.html", wait_until="networkidle", timeout=60000)
                  assert response and response.status == 200
                  assert await page.title() == "AI Agent Integration Patterns: StableDomains + SwiftNodes"
                  body = await page.locator("body").inner_text()
                  assert "X-SD-Ref" in body and "SWIFTNODES_API_KEY" in body
                  assert "explicit approval" in body.lower()
                  assert await page.locator('a[rel="sponsored nofollow"][href*="swiftnodes.io/?ref=xxuxt8dw"]').count() == 1
                  response = await page.goto(base + "agent-marketplaces.html", wait_until="networkidle", timeout=60000)
                  assert response and response.status == 200
                  assert await page.title() == "Where to Sell AI Agent Skills and Services | Dev & Agent Toolbox"
                  market_body = await page.locator("body").inner_text()
                  assert "AgentMart" in market_body and "Colony HQ" in market_body and "Soul.Markets" in market_body
                  assert "What is prepared" in market_body
                  assert await page.locator('a[href*="tree/main/marketplace/lead-followup-strategist"]').count() == 1
                  response = await page.request.get(os.environ["PAGES_URL"] + "sitemap.xml")
                  assert response.status == 200
                  sitemap = await response.text()
                  assert "agent-integration-patterns.html" in sitemap and "blockchain-infrastructure.html" in sitemap
                  response = await page.request.get(os.environ["PAGES_URL"] + "robots.txt")
                  assert response.status == 200 and "sitemap.xml" in await response.text()
                  response = await page.goto(os.environ["PAGES_URL"] + "products/marketplace-hub.html", wait_until="networkidle", timeout=60000)
                  assert response and response.status == 200
                  assert await page.title() == "Falcon Project AI — Product Hub"
                  hub_body = await page.locator("body").inner_text()
                  for name in ["Lead Follow-up Strategist", "Quote-to-Booking Workflow Planner", "JSON Contract Tester", "Dev & Agent Toolbox", "LocalBiz FollowUp", "StockPulse", "MCPGuard Lite", "ExpenseSnap", "CronPulse"]:
                      assert name in hub_body, f"Missing product listing: {name}"
                  assert "approved/live" in hub_body.lower() and "security approved" in hub_body.lower()
                  assert "review pending" in hub_body.lower()
                  assert await page.locator('a[href*="tool=7727"]').count() == 1
                  assert await page.locator('a[href*="tool=9754"]').count() == 1
                  assert not errors, f"Browser JavaScript errors: {errors}"
                  await browser.close()

          asyncio.run(main())
          PY

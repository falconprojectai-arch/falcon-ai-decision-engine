openapi: 3.1.0
info:
  title: JSON Contract Tester API
  version: 0.1.0
  description: >-
    JSON Schema validation API for AI agents, LLM structured outputs, API
    responses, webhook payloads, and backend data contracts. Batch-validate
    1–10 JSON samples against a documented JSON Schema subset and receive
    per-sample PASS/FAIL results with structured JSON Pointer diagnostics.
    Paid access is currently paused pending receiving-wallet verification.
    Useful for API response validation, AI-agent output checks, webhook
    contract testing, and regression checks. This is not full JSON Schema;
    the pattern keyword is unsupported. A syntactically valid unpaid request
    receives an x402 challenge before schema validation. Schema-invalid
    attempts are validated after payment and may return a billable 400.
servers:
  - url: https://json-contract-tester-api.falcon-project-ai.workers.dev
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: { const: ok }
                  service: { const: json-contract-tester-api }
                  version: { type: string }
  /.well-known/x402:
    get:
      operationId: getX402DiscoveryManifest
      summary: x402 discovery manifest
      security: []
      responses:
        '200':
          description: Service and paid-resource discovery metadata when payments are enabled
        '503':
          description: Payments are disabled pending receiver verification
  /.well-known/x402.json:
    get:
      operationId: getCdpBazaarX402Manifest
      summary: x402 v2 manifest for agent marketplaces
      description: Payment discovery is disabled until the receiving wallet is independently verified.
      security: []
      responses:
        '503':
          description: Payments are disabled pending receiver verification
  /openapi.json:
    get:
      operationId: getOpenApiDocument
      summary: OpenAPI JSON document
      security: []
      responses:
        '200':
          description: Machine-readable API contract
  /v1/validate-batch:
    get:
      operationId: probeValidateBatchGet
      summary: Read-only x402 discovery probe (validation requires POST)
      description: >-
        Payments are currently paused. This read-only discovery route returns
        HTTP 503 until receiver verification is complete.
      responses:
        '503':
          description: Payments are disabled pending receiver verification
    head:
      operationId: probeValidateBatchHead
      summary: Read-only discovery probe (validation requires POST)
      description: >-
        Payments are currently paused. This route returns HTTP 503 until
        receiver verification is complete.
      responses:
        '503':
          description: Payments are disabled pending receiver verification
    post:
      operationId: validateJsonBatch
      summary: Validate JSON Schema for AI outputs, API responses, and webhooks
      description: >-
        Paid access is currently paused pending receiving-wallet verification.
        When access is reopened, this endpoint will validate AI-agent outputs,
        API responses, webhook payloads, and backend JSON data contracts against
        the documented schema subset. Send one schema and 1–10 JSON samples.
        The current production response is HTTP 503; no payment challenge or
        checkout is available. The hosted API does not support the JSON Schema
        pattern keyword.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
            example:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: { type: boolean }
                  result: { type: string }
              outputs:
                - id: sample-1
                  json: { ok: true, result: done }
                - id: sample-2
                  json: { ok: "yes", result: done }
      responses:
        '200':
          description: Batch validated; individual samples may pass or fail
          headers:
            PAYMENT-RESPONSE:
              description: x402 settlement response metadata
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          description: Malformed JSON or invalid schema/batch shape
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Request body exceeds 64 KiB; rejected before payment
        '503':
          description: Payments are disabled pending receiver verification or payment receiver is not configured
      tags:
        - json-schema-validation
        - json-validation
        - api-response-validation
        - ai-agent-output
        - structured-output
        - webhook-validation
        - contract-testing
        - regression-testing
components:
  schemas:
    BatchRequest:
      type: object
      required: [schema, outputs]
      properties:
        schema:
          type: object
          description: Documented JSON Schema subset (not full JSON Schema)
        outputs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [json]
            properties:
              id: { type: string, maxLength: 80 }
              json: {}
    BatchResponse:
      type: object
      required: [reportVersion, tool, valid, summary, results, limitation]
      properties:
        reportVersion: { type: string }
        tool: { const: JSON Contract Tester API }
        valid: { type: boolean }
        summary:
          type: object
          required: [total, passed, failed]
          properties:
            total: { type: integer }
            passed: { type: integer }
            failed: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [id, passed, errors]
            properties:
              id: { type: string }
              passed: { type: boolean }
              errors:
                type: array
                items:
                  type: object
                  required: [instancePath, schemaPath, keyword, message, expected, actual]
                  properties:
                    instancePath: { type: string }
                    schemaPath: { type: string }
                    keyword: { type: string }
                    message: { type: string }
                    expected: {}
                    actual: {}
        limitation: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
